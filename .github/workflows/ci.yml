name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: npm run check
      - name: Enforce architecture conformance
        run: npm run test:architecture
      - name: Validate production operations framework
        run: npm run test:operations
      - name: Validate enterprise service operations
        run: npm run test:service-operations
      - name: Validate wave transition framework
        run: npm run test:wave-transition
      - name: Validate enterprise platform evolution
        run: npm run test:platform-evolution
      - run: npm run test:coverage
      - run: npm run build --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  agent-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:agent-governance

  whatsapp-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:whatsapp-provider

  provider-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:provider-conformance

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npm audit --omit=dev --audit-level=high

  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:recovery

  migration-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset
      - name: Verify deterministic schema recovery
        shell: bash
        run: |
          set -euo pipefail
          dump_dir="$(mktemp -d)"
          trap 'rm -rf "$dump_dir"' EXIT
          first_dump="$dump_dir/first.sql"
          recovered_dump="$dump_dir/recovered.sql"
          npx supabase db dump --local --schema public --file "$first_dump"
          test -s "$first_dump"
          grep -q "runtime_outbox_events" "$first_dump"
          sha256sum "$first_dump"
          npx supabase db reset
          npx supabase db dump --local --schema public --file "$recovered_dump"
          test -s "$recovered_dump"
          sha256sum "$recovered_dump"
          cmp "$first_dump" "$recovered_dump"
      - if: always()
        run: npx supabase stop

  live-database:
    if: github.event_name == 'pull_request' && vars.RUN_LIVE_DATABASE_TESTS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset
      - name: Run live database tests against the PR schema
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env)"
          MEDLINK_LIVE_SUPABASE_URL="$API_URL" \
          MEDLINK_LIVE_SUPABASE_ANON_KEY="$PUBLISHABLE_KEY" \
          MEDLINK_LIVE_SUPABASE_SERVICE_KEY="$SECRET_KEY" \
          npm run test:live
      - if: always()
        run: npx supabase stop

  browser-auth-e2e:
    # Auth-only browser certification (Section 15's "who is acting"
    # gate) -- deliberately separate from the full medication golden-loop
    # E2E suite, which is its own, later, more expensive certification.
    # Gated the same way as live-database (real Supabase + built apps
    # required) rather than inventing a second toggle for this slice.
    if: github.event_name == 'pull_request' && vars.RUN_LIVE_DATABASE_TESTS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: packages/e2e
      - run: npx supabase start
      - run: npx supabase db reset
      - name: Build patient, pharmacist, pharmacy, and admin against the local Supabase instance
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$PUBLISHABLE_KEY" \
          npm run build --workspace=apps/patient --workspace=apps/pharmacist --workspace=apps/pharmacy --workspace=apps/admin
      - name: Start patient, pharmacist, pharmacy, and admin, then run the auth E2E suite
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$PUBLISHABLE_KEY"

          MEDLINK_PUBLIC_ORIGIN=http://localhost:3000 PORT=3000 MEDLINK_API_URL=http://localhost:3000 npm run start --workspace=apps/patient &
          MEDLINK_PUBLIC_ORIGIN=http://localhost:3003 PORT=3003 MEDLINK_API_URL=http://localhost:3003 npm run start --workspace=apps/pharmacist &
          MEDLINK_PUBLIC_ORIGIN=http://localhost:3002 PORT=3002 MEDLINK_API_URL=http://localhost:3002 npm run start --workspace=apps/pharmacy &
          MEDLINK_PUBLIC_ORIGIN=http://localhost:3001 PORT=3001 MEDLINK_API_URL=http://localhost:3001 npm run start --workspace=apps/admin &

          for url in http://localhost:3000/auth/sign-in http://localhost:3003/auth/sign-in http://localhost:3002/auth/sign-in http://localhost:3001/auth/sign-in; do
            for _ in $(seq 1 30); do
              if curl -sf "$url" > /dev/null; then break; fi
              sleep 1
            done
            curl -sf "$url" > /dev/null
          done

          MEDLINK_E2E_SUPABASE_URL="$API_URL" \
          MEDLINK_E2E_SUPABASE_SERVICE_KEY="$SECRET_KEY" \
          MEDLINK_E2E_PATIENT_URL=http://localhost:3000 \
          MEDLINK_E2E_PHARMACIST_URL=http://localhost:3003 \
          MEDLINK_E2E_PHARMACY_URL=http://localhost:3002 \
          MEDLINK_E2E_ADMIN_URL=http://localhost:3001 \
          MEDLINK_E2E_MAILPIT_URL=http://127.0.0.1:54324 \
          npm run test:auth --workspace=packages/e2e
      - if: always()
        run: npx supabase stop
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-auth-e2e-report
          path: packages/e2e/playwright-report/
          retention-days: 14

  medication-golden-loop-e2e:
    # Gate 2 of the two-gate framing (browser-auth-e2e above is Gate 1,
    # "who is acting"): one real authenticated transaction across three
    # personas -- patient request, pharmacist review, patient match/reserve,
    # pharmacy confirm, verified payment failure/retry/success, ready,
    # patient pickup credential, pharmacy collect --
    # initiated by a signed, duplicate-safe WhatsApp discovery and continued
    # through real browser sessions, real Postgres, real RLS, real RPCs. The
    # simulator also captures READY/collected notifications and proves the
    # pickup credential never enters the channel.
    # Deliberately its own
    # job, not folded into browser-auth-e2e, matching the "keep full
    # medication golden-loop E2E separate" plan from PR #29.
    if: github.event_name == 'pull_request' && vars.RUN_LIVE_DATABASE_TESTS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: packages/e2e
      - run: npx supabase start
      - run: npx supabase db reset
      - name: Build patient, pharmacist, pharmacy, and worker host against local Supabase
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$PUBLISHABLE_KEY" \
          npm run build --workspace=apps/patient --workspace=apps/pharmacist --workspace=apps/pharmacy --workspace=apps/web
      - name: Start persona apps and worker host, then run the medication golden-loop E2E suite
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$PUBLISHABLE_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SECRET_KEY"
          export MEDLINK_CLINICAL_WORKER_TOKEN="medlink-e2e-clinical-worker-token-0001"
          export MEDLINK_OCR_PROVIDER_URL="http://127.0.0.1:4010/ocr"
          export MEDLINK_PARSER_PROVIDER_URL="http://127.0.0.1:4010/parse"
          export MEDLINK_FILE_SCANNER_URL="http://127.0.0.1:4010/scan"
          export WHATSAPP_APP_SECRET="medlink-e2e-whatsapp-secret-0001"
          export WHATSAPP_VERIFY_TOKEN="medlink-e2e-whatsapp-verify-0001"
          export WHATSAPP_ACCESS_TOKEN="medlink-e2e-token"
          export MEDLINK_NOTIFICATION_WORKER_TOKEN="medlink-e2e-notification-worker-token-0001"
          export MEDLINK_E2E_WHATSAPP_GRAPH_API_BASE_URL="http://127.0.0.1:4010"
          export MEDLINK_PAYMENT_PROVIDER_URL="http://127.0.0.1:4010"
          export MEDLINK_PAYMENT_PROVIDER_KEY="medlink-e2e-payment-provider-key-0001"
          export PAYMENT_WEBHOOK_SECRET="medlink-e2e-payment-webhook-secret-0001"
          export MEDLINK_PAYMENT_REFUND_WORKER_TOKEN="medlink-e2e-payment-refund-worker-token-0001"
          export ANTHROPIC_API_KEY="medlink-e2e-anthropic-key-0001"
          export ANTHROPIC_MODEL="medlink-e2e-deterministic-v1"
          export ANTHROPIC_ENDPOINT="http://127.0.0.1:4010/anthropic/messages"

          node packages/e2e/provider-simulator.mjs &
          WHATSAPP_ACCESS_TOKEN= MEDLINK_PUBLIC_ORIGIN=http://localhost:3000 PORT=3000 MEDLINK_API_URL=http://localhost:3000 npm run start --workspace=apps/patient &
          MEDLINK_PUBLIC_ORIGIN=http://localhost:3003 PORT=3003 MEDLINK_API_URL=http://localhost:3003 npm run start --workspace=apps/pharmacist &
          WHATSAPP_ACCESS_TOKEN= MEDLINK_PUBLIC_ORIGIN=http://localhost:3002 PORT=3002 MEDLINK_API_URL=http://localhost:3002 npm run start --workspace=apps/pharmacy &
          MEDLINK_APP_URL=http://localhost:3004 PORT=3004 MEDLINK_API_URL=http://localhost:3004 npm run start --workspace=apps/web &

          for url in http://localhost:3000/auth/sign-in http://localhost:3003/auth/sign-in http://localhost:3002/auth/sign-in http://localhost:3004/health/live; do
            for _ in $(seq 1 30); do
              if curl -sf "$url" > /dev/null; then break; fi
              sleep 1
            done
            curl -sf "$url" > /dev/null
          done

          MEDLINK_E2E_SUPABASE_URL="$API_URL" \
          MEDLINK_E2E_SUPABASE_SERVICE_KEY="$SECRET_KEY" \
          MEDLINK_E2E_PATIENT_URL=http://localhost:3000 \
          MEDLINK_E2E_PHARMACIST_URL=http://localhost:3003 \
          MEDLINK_E2E_PHARMACY_URL=http://localhost:3002 \
          MEDLINK_E2E_WEB_URL=http://localhost:3004 \
          MEDLINK_E2E_CLINICAL_WORKER_TOKEN="$MEDLINK_CLINICAL_WORKER_TOKEN" \
          MEDLINK_E2E_NOTIFICATION_WORKER_TOKEN="$MEDLINK_NOTIFICATION_WORKER_TOKEN" \
          MEDLINK_E2E_PROVIDER_URL=http://127.0.0.1:4010 \
          MEDLINK_E2E_WHATSAPP_APP_SECRET="$WHATSAPP_APP_SECRET" \
          MEDLINK_E2E_PAYMENT_WEBHOOK_SECRET="$PAYMENT_WEBHOOK_SECRET" \
          MEDLINK_E2E_MAILPIT_URL=http://127.0.0.1:54324 \
          npm run test:whatsapp-golden-loop --workspace=packages/e2e

          MEDLINK_E2E_SUPABASE_URL="$API_URL" \
          MEDLINK_E2E_SUPABASE_SERVICE_KEY="$SECRET_KEY" \
          MEDLINK_E2E_PATIENT_URL=http://localhost:3000 \
          MEDLINK_E2E_WEB_URL=http://localhost:3004 \
          MEDLINK_E2E_PROVIDER_URL=http://127.0.0.1:4010 \
          MEDLINK_E2E_PAYMENT_WEBHOOK_SECRET="$PAYMENT_WEBHOOK_SECRET" \
          MEDLINK_E2E_PAYMENT_REFUND_WORKER_TOKEN="$MEDLINK_PAYMENT_REFUND_WORKER_TOKEN" \
          MEDLINK_E2E_MAILPIT_URL=http://127.0.0.1:54324 \
          npm run test:payment-refund --workspace=packages/e2e

          MEDLINK_E2E_SUPABASE_URL="$API_URL" \
          MEDLINK_E2E_SUPABASE_SERVICE_KEY="$SECRET_KEY" \
          MEDLINK_E2E_WEB_URL=http://localhost:3004 \
          MEDLINK_E2E_MAILPIT_URL=http://127.0.0.1:54324 \
          npm run test:partner --workspace=packages/e2e
      - if: always()
        run: npx supabase stop
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medication-golden-loop-e2e-report
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          retention-days: 14
