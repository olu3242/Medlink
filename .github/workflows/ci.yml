name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present

  migration-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset
      - name: Verify schema export integrity
        shell: bash
        run: |
          set -euo pipefail
          dump_file="$(mktemp)"
          trap 'rm -f "$dump_file"' EXIT
          npx supabase db dump --local --schema public --file "$dump_file"
          test -s "$dump_file"
          grep -q "runtime_outbox_events" "$dump_file"
          sha256sum "$dump_file"
      - if: always()
        run: npx supabase stop

  live-database:
    if: github.event_name == 'pull_request' && vars.RUN_LIVE_DATABASE_TESTS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live
        env:
          MEDLINK_LIVE_SUPABASE_URL: ${{ secrets.MEDLINK_LIVE_SUPABASE_URL }}
          MEDLINK_LIVE_SUPABASE_ANON_KEY: ${{ secrets.MEDLINK_LIVE_SUPABASE_ANON_KEY }}
