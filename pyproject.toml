[project]
name = "medlink-nafdac-acquisition"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tools*"]
exclude = ["tools.nafdac_manufacturers.tests*"]

[tool.pytest.ini_options]
testpaths = ["tools/nafdac_manufacturers/tests"]
addopts = "-q -p no:cacheprovider --basetemp=../medlink-pytest-temp"
