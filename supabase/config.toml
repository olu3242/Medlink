project_id = "medlink-local"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
# Patient (3000/web) was already covered by site_url + its 127.0.0.1
# alias. Pharmacist (3003) and pharmacy (3002) sign in through their own
# apps' emailRedirectTo now too -- GoTrue rejects any redirect_to it
# can't match against this allowlist, silently falling back to site_url
# instead of the requesting app, so both needed adding explicitly.
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://localhost:3002",
  "http://127.0.0.1:3002",
  "http://localhost:3003",
  "http://127.0.0.1:3003",
]
jwt_expiry = 3600

# The auth E2E suite signs the same handful of fixture personas in
# repeatedly across several tests in one run (patient.email alone across
# three), well within GoTrue's default local rate limits meant for a
# single human clicking "resend" by hand. Local/CI-only -- production
# uses the hosted platform's own configured limits, not this file.
#
# email_sent raised from 100: speculative first attempt at the
# AuthRetryableFetchError 500s below -- disproven by CI, kept anyway since
# it's harmless and the run does create ~25-30 new auth users. The actual
# cause was sign_in_sign_ups (added below): admin.createUser() is a sign-up
# for rate-limiting purposes regardless of email_confirm, and GoTrue's
# default local bucket for it is small and burst-limited, not just an
# hourly total -- CI logs showed payment-reconciliation-self-review-live's
# two createUser() calls issued back-to-back with no intervening await
# (packages/runtime/src/payment-reconciliation-self-review-live.test.ts's
# buildReconciliationCase: pharmacist then staff, no request between them)
# always failing on the second call, deterministically, even after raising
# email_sent 10x and even when that file was reordered to run first in
# test:live -- neither matches an hourly-total limiter, both match a
# burst/short-window one.
[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
