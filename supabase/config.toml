project_id = "medlink-local"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
# Patient (3000/web) was already covered by site_url + its 127.0.0.1
# alias. Pharmacist (3003) and pharmacy (3002) sign in through their own
# apps' emailRedirectTo now too -- GoTrue rejects any redirect_to it
# can't match against this allowlist, silently falling back to site_url
# instead of the requesting app, so both needed adding explicitly.
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://localhost:3002",
  "http://127.0.0.1:3002",
  "http://localhost:3003",
  "http://127.0.0.1:3003",
]
jwt_expiry = 3600

# The auth E2E suite signs the same handful of fixture personas in
# repeatedly across several tests in one run (patient.email alone across
# three), well within GoTrue's default local rate limits meant for a
# single human clicking "resend" by hand. Local/CI-only -- production
# uses the hosted platform's own configured limits, not this file.
#
# Raised from 100: the live-database job's test:live run now also
# provisions ~25-30 brand-new auth users per run across
# clinical-review-self-review-live.test.ts and
# payment-reconciliation-self-review-live.test.ts alone (each
# admin.createUser() call counts against this limiter, confirmation
# email or not), on top of every other live test file's own fixture
# users within the same hour-long window -- CI logs showed
# AuthRetryableFetchError 500s from createUser() specifically once the
# cumulative total for the run climbed past the old 100 cap.
[auth.rate_limit]
email_sent = 1000
